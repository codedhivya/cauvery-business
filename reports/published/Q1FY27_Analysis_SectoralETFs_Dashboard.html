<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#1c2230;--mute:#5d6678;--line:#e3e6ec;--brand:#0b6e4f;--brand2:#e8f4ef;--pos:#138a50;--neg:#c0392b;--warn:#b7791f;--accent:#1f5fbf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans Tamil",system-ui,sans-serif;font-size:15px;line-height:1.55}
body.ta{font-family:"Noto Sans Tamil",Inter,system-ui,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;padding:12px 0}
.brand{font-weight:700;color:var(--brand);font-size:18px}
.brand small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.ctrls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--ink)}
button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
button.voice{border-color:var(--accent);color:var(--accent)}
button.voice.speaking{background:var(--accent);color:#fff}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px}
nav button{white-space:nowrap;border:none;border-bottom:3px solid transparent;border-radius:0;background:none;color:var(--mute);font-weight:600}
nav button.on{color:var(--brand);border-bottom-color:var(--brand);background:none}
main{padding:20px 0 40px}
section{display:none}
section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:15px;margin:14px 0 6px}
.sub{color:var(--mute);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .l{font-size:12px;color:var(--mute)}
.kpi .v{font-size:24px;font-weight:700}
.kpi .n{font-size:12px;color:var(--mute)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.shead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tbl{width:100%;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{background:#f1f4f7;font-size:12px;color:var(--mute);cursor:pointer;position:sticky;top:0}
tr:hover td{background:#fafcfd}
.bars{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.bar{display:grid;grid-template-columns:190px 1fr;align-items:center;gap:8px;font-size:13px}
.track{position:relative;height:24px;background:#f3f5f8;border-radius:4px}
.mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#9aa3b2}
.fill{position:absolute;top:3px;height:18px;border-radius:3px}
.val{position:absolute;top:3px;font-size:12px;font-weight:600;line-height:18px}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700}
.buy{background:#e3f5ea;color:var(--pos)}.hold{background:#fdf3e1;color:var(--warn)}.sell{background:#fbe6e4;color:var(--neg)}
.note{background:var(--brand2);border-left:4px solid var(--brand);padding:10px 14px;border-radius:6px;font-size:14px}
.warnbox{background:#fff8ea;border-left:4px solid var(--warn);padding:10px 14px;border-radius:6px;font-size:13px}
ul{margin:6px 0;padding-left:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips button{font-size:13px;padding:4px 10px}
#vstatus{font-size:12px;color:var(--accent)}
footer{color:var(--mute);font-size:12px;padding:20px 0}
@media(max-width:720px){.grid2{grid-template-columns:1fr}.bar{grid-template-columns:120px 1fr}.kpi .v{font-size:20px}}
</style>
</head>

 <div class="card" style="margin-top:16px"><ul>${t.ovPoints.map(x=>`<li>${x}</li>`).join('')}</ul><div class="note">${t.ovNote}</div></div>
 <div class="card"><h2>${t.p.c20}</h2>${bars('c20')}</div>`;

 $('s-returns').innerHTML=`<div class="card"><div class="shead"><h2>${t.rTitle}</h2></div><div class="sub">${t.rSub}</div>
 <div class="chips">${Object.keys(t.p).map(k=>`<button class="${k===PER?'on':''}" onclick="PER='${k}';render()">${t.p[k]}</button>`).join('')}</div>
 ${bars(PER)}</div>
 <div class="card tbl"><table id="rt"><thead><tr>${t.th.map((h,i)=>`<th onclick="sortRt(${i})">${h}</th>`).join('')}</tr></thead><tbody>
 ${[...S,N50].map(o=>`<tr${o===N50?' style="font-weight:700;background:#f7faf9"':''}><td>${nm(o)}</td><td class="${cls(o.cy25)}">${f(o.cy25)}</td><td class="${cls(o.ytd)}">${f(o.ytd)}</td><td class="${cls(o.c20)}">${f(o.c20)}</td><td class="${cls(o.y1)}">${f(o.y1)}</td><td class="${cls(o.qtd)}">${f(o.qtd)}</td><td>${o.beta.toFixed(2)}</td><td>${o.sd==null?'—':o.sd.toFixed(2)+'%'}</td></tr>`).join('')}
 </tbody></table></div>`;

 const secs=['all',...new Set(E.map(e=>e[3]))];
 $('s-etfs').innerHTML=`<div class="card"><h2>${t.eTitle}</h2><div class="sub">${t.eSub}</div>
 <div class="chips">${secs.map(k=>`<button class="${k===EF?'on':''}" onclick="EF='${k}';render()">${k==='all'?t.all:nm(S.find(o=>o.k===k)).replace(/^நிஃப்டி |^Nifty /,'')}</button>`).join('')}</div></div>
 <div class="card tbl"><table><thead><tr>${t.eth.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>
 ${E.filter(e=>EF==='all'||e[3]===EF).map(e=>{const o=S.find(s=>s.k===e[3]);const r=o.c20!=null?o.c20:o.y1;return `<tr><td>${e[0]}</td><td><b>${e[1]}</b></td><td>${e[2]}</td><td>${nm(o)}</td><td class="${cls(r)}">${f(r,1)}${o.c20==null?' (1Y)':''}</td><td>${e[4]}</td></tr>`}).join('')}
 </tbody></table></div>`;

 const bh=o=>{if(o.fb)return o.fb;const w=[o.feb25,o.mar26].filter(v=>v!=null);const m=w.length?Math.min(...w):null;
  if(o.beta<0.8&&(o.ytd>0))return 'good';if(o.beta>=1.2||(m!=null&&m<=-12))return 'bad';if(o.ytd!=null&&o.ytd>10&&(m==null||m>-12))return 'good';return 'mid'};
 $('s-fall').innerHTML=`<div class="card"><h2>${t.fTitle}</h2><div class="sub">${t.fSub}</div><p class="note">${t.fShort}</p></div>
 <div class="grid2"><div class="card"><h3>${t.f1}</h3><p>${t.f1t}</p></div><div class="card"><h3>${t.f2}</h3><p>${t.f2t}</p></div></div>
 <div class="card tbl"><table><thead><tr>${t.fth.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>
 ${[...S].sort((a,b)=>a.beta-b.beta).map(o=>{const b=bh(o);return `<tr><td>${nm(o)}</td><td>${o.beta.toFixed(2)}</td><td class="${cls(o.feb25)}">${f(o.feb25)}</td><td class="${cls(o.mar26)}">${o.mar26===-15?(L==='en'?'< -15%':'-15%-க்கு மேல்'):f(o.mar26)}</td><td class="${cls(o.ytd)}">${f(o.ytd)}</td><td><span class="pill ${b==='good'?'buy':b==='bad'?'sell':'hold'}">${t.beh[b]}</span></td></tr>`}).join('')}
 </tbody></table><div class="sub" style="margin-top:6px">Beta &lt; 1 = ${L==='en'?'moves less than Nifty 50':'நிஃப்டி 50-ஐ விடக் குறைவாக நகரும்'} · Beta &gt; 1 = ${L==='en'?'moves more than Nifty 50':'நிஃப்டி 50-ஐ விட அதிகமாக நகரும்'}</div></div>
 <div class="card"><h3>${t.fRules}</h3><ol>${t.fList.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;

 const pes=[...S.filter(o=>o.pe),N50];
 $('s-q1').innerHTML=`<div class="card"><h2>${t.qTitle}</h2><ul>${t.qPoints.map(x=>`<li>${x}</li>`).join('')}</ul></div>
 <div class="card tbl"><table><thead><tr>${t.qth.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>
 ${pes.map(o=>{const g=(o.pe/o.pem-1)*100;return `<tr><td>${nm(o)}</td><td>${o.pe.toFixed(2)}</td><td>${o.pem.toFixed(2)}</td><td class="${g<0?'pos':'neg'}">${f(g,0)}</td></tr>`}).join('')}
 </tbody></table></div>
 <div class="card"><h2>${L==='en'?'June 2026 month (last month of Q1FY27)':'ஜூன் 2026 மாதம் (Q1FY27 கடைசி மாதம்)'}</h2>${bars('jun26')}</div>`;

 $('s-view').innerHTML=`<div class="card"><h2>${t.vTitle}</h2><div class="sub">${t.vSub}</div></div>
 <div class="card tbl"><table><thead><tr>${t.vth.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>
 ${S.map(o=>{const v=V[o.k];return `<tr><td>${nm(o)}</td><td><span class="pill ${v[0]}">${t.st[v[0]]}</span></td><td style="text-align:left;white-space:normal">${L==='en'?v[1]:v[2]}</td></tr>`}).join('')}
 </tbody></table></div>
 <div class="card"><h3>${t.alloc}</h3><ul>${t.allocL.map(x=>`<li>${x}</li>`).join('')}</ul><div class="warnbox">${t.disc}</div></div>`;


 $('foot').textContent=t.disc;
}

function bars(key){
 const rows=S.filter(o=>o[key]!=null).sort((a,b)=>b[key]-a[key]);
 if(key!=='jun26'&&N50[key]!=null)rows.push(N50);
 const mx=Math.max(...rows.map(o=>Math.abs(o[key])),1)*1.25;
 return `<div class="bars">${rows.map(o=>{const v=o[key],w=Math.abs(v)/mx*50,pos=v>=0;
  return `<div class="bar"><div${o===N50?' style="font-weight:700"':''}>${nm(o)}</div><div class="track"><div class="mid"></div>
  <div class="fill" style="${pos?`left:50%`:`right:50%`};width:${w}%;background:${o===N50?'#5d6678':pos?'#1d9a5f':'#d0574a'}"></div>
  <div class="val ${pos?'pos':'neg'}" style="${pos?`left:calc(50% + ${w}% + 4px)`:`right:calc(50% + ${w}% + 4px)`}">${f(v,1)}</div></div></div>`}).join('')}</div>`;
}

let sortDir={};
function sortRt(i){
 const tb=document.querySelector('#rt tbody');const rows=[...tb.rows];sortDir[i]=!sortDir[i];
 rows.sort((a,b)=>{const x=a.cells[i].textContent,y=b.cells[i].textContent;
  if(i===0)return sortDir[i]?x.localeCompare(y):y.localeCompare(x);
  const p=s=>s==='—'?-999:parseFloat(s);return sortDir[i]?p(y)-p(x):p(x)-p(y)});
 rows.forEach(r=>tb.appendChild(r));
}
function go(k){TAB=k;stopSpeak();render();window.scrollTo({top:0,behavior:'smooth'})}
function setLang(l){L=l;$('bEN').classList.toggle('on',l==='en');$('bTA').classList.toggle('on',l==='ta');stopSpeak();render()}

/* ============ VOICE ASSIST ============ */
const synth=window.speechSynthesis;
function narration(){
 const t=T[L],ranked=S.filter(o=>o.c20!=null).sort((a,b)=>b.c20-a.c20);
 const top=ranked.slice(0,3).map(o=>nm(o)+' '+o.c20.toFixed(1)+'%').join(', ');
 const bot=ranked.slice(-3).map(o=>nm(o)+' '+o.c20.toFixed(1)+'%').join(', ');
 switch(TAB){
  case 'overview':return [t.ovTitle,t.ovSub,...t.ovPoints,t.ovNote].join('. ');
  case 'returns':return L==='en'?`${t.rTitle}. Over 20 months the top three are ${top}. The bottom three are ${bot}. Nifty 50 returned ${N50.c20.toFixed(1)} percent.`:`${t.rTitle}. 20 மாதங்களில் முதல் மூன்று: ${top}. கடைசி மூன்று: ${bot}. நிஃப்டி 50 வருமானம் ${N50.c20.toFixed(1)} சதவீதம்.`;
  case 'etfs':return L==='en'?`${t.eTitle}. ${t.eSub} Popular choices: Bank BeES for banking, PSU Bank BeES for public sector banks, Pharma BeES for pharma, IT BeES for IT, Metal I ETF for metals, and Motilal Oswal Defence ETF for defence.`:`${t.eTitle}. ${t.eSub} பிரபலமானவை: வங்கிக்கு Bank BeES, பொதுத்துறை வங்கிக்கு PSU Bank BeES, பார்மாவுக்கு Pharma BeES, IT-க்கு IT BeES, மெட்டலுக்கு Metal I ETF, டிஃபென்ஸுக்கு மோதிலால் ஓஸ்வால் டிஃபென்ஸ் ETF.`;
  case 'fall':return [t.fTitle,t.fShort,t.f1,t.f1t,t.f2,t.f2t,t.fRules,...t.fList].join('. ');
  case 'q1':return [t.qTitle,...t.qPoints].join('. ');
  case 'view':return [t.vTitle,...S.map(o=>nm(o)+': '+t.st[V[o.k][0]]+'. '+(L==='en'?V[o.k][1]:V[o.k][2])),t.disc].join(' ');
 }
}
function pickVoice(){
 const vs=synth.getVoices(),want=L==='en'?['en-IN','en-GB','en-US']:['ta-IN','ta'];
 for(const w of want){const v=vs.find(x=>x.lang&&x.lang.replace('_','-').toLowerCase().startsWith(w.toLowerCase()));if(v)return v}
 return null;
}
function readSection(){
 if(!synth){$('vstatus').textContent=T[L].noVoice;return}
 stopSpeak();
 const txt=narration().replace(/→/g,L==='en'?' to ':' முதல் ').replace(/≈/g,L==='en'?'about ':'சுமார் ').replace(/~/g,'');
 const v=pickVoice(); if(L==='ta'&&!v)$('vstatus').textContent=T.ta.noTa;
 const parts=txt.match(/[^.!?]+[.!?]*/g)||[txt];
 parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p.trim());u.lang=L==='en'?'en-IN':'ta-IN';if(v)u.voice=v;u.rate=parseFloat($('rate').value);
  if(i===0)u.onstart=()=>$('bRead').classList.add('speaking');
  if(i===parts.length-1)u.onend=()=>$('bRead').classList.remove('speaking');
  synth.speak(u)});
}
function stopSpeak(){if(synth)synth.cancel();$('bRead')&&$('bRead').classList.remove('speaking')}
if(synth)synth.onvoiceschanged=()=>{};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(){
 if(!SR){$('vstatus').textContent=T[L].noVoice;return}
 const r=new SR();r.lang=L==='en'?'en-IN':'ta-IN';r.interimResults=false;
 $('vstatus').textContent=T[L].listening;
 r.onresult=e=>{const s=e.results[0][0].transcript.toLowerCase();$('vstatus').textContent='“'+s+'”';handleCmd(s)};
 r.onerror=()=>{$('vstatus').textContent=T[L].vHelp};
 r.start();
}
function handleCmd(s){
 const has=(...w)=>w.some(x=>s.includes(x));
 if(has('tamil','தமிழ்'))return setLang('ta');
 if(has('english','ஆங்கிலம்'))return setLang('en');
 if(has('stop','நிறுத்து'))return stopSpeak();
 if(has('overview','summary','மேலோட்ட'))go('overview');
 else if(has('return','performance','வருமான'))go('returns');
 else if(has('etf','list','பட்டியல்'))go('etfs');
 else if(has('fall','crash','bear','சரி','வீழ்ச்சி'))go('fall');
 else if(has('quarter','q1','காலாண்டு'))go('q1');
 else if(has('view','rating','buy','பார்வை','நிலைப்பாடு'))go('view');

 if(has('read','listen','படி','கேள்'))readSection();
}
render();
</script>
</body>
</html>
